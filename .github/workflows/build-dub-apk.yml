name: Build APK (dub audio)

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-dub-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AVATAR_PUBLIC_BASE_URL: ${{ secrets.AVATAR_PUBLIC_BASE_URL }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            : > local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            : > local.dev.properties
          fi

          # Plain secrets (if set) are appended last, so they win over anything above.
          # Uygulama NUVIO_ onekli anahtarlari okuyor.
          printf '\n' >> local.properties
          if [ -n "$SUPABASE_URL" ]; then
            printf 'NUVIO_SUPABASE_URL=%s\n' "$SUPABASE_URL" >> local.properties
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> local.properties
          fi
          if [ -n "$AVATAR_PUBLIC_BASE_URL" ]; then
            printf 'AVATAR_PUBLIC_BASE_URL=%s\n' "$AVATAR_PUBLIC_BASE_URL" >> local.properties
          fi

          # Debug builds read local.dev.properties first: give it the same values.
          printf '\n' >> local.dev.properties
          cat local.properties >> local.dev.properties

          echo "=== kontrol (degerler gosterilmez) ==="
          for f in local.properties local.dev.properties; do
            for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY AVATAR_PUBLIC_BASE_URL; do
              if grep -q "^$k=." "$f"; then echo "$f $k: VAR"; else echo "$f $k: EKSIK"; fi
            done
          done

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
