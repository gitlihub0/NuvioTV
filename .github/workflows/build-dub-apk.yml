name: Build APK (dub audio)

on:
  workflow_dispatch:
  push:
    branches: [feature/external-dub-audio]

permissions:
  contents: read

concurrency:
  group: build-dub-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

          # Uygulama NUVIO_ onekli anahtarlari okuyor; mevcut SUPABASE_ degerlerini bu adlarla da yaz
          for f in local.properties local.dev.properties; do
            sed -i 's/\r$//' "$f"
            echo >> "$f"
            for k in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_FALLBACK_URL; do
              v=$(grep -E "^(NUVIO_)?${k}=" "$f" | tail -n1 | cut -d= -f2-)
              if [ -n "$v" ]; then
                echo "NUVIO_${k}=${v}" >> "$f"
              fi
            done
          done

          echo "=== kontrol (degerler gosterilmez) ==="
          for f in local.properties local.dev.properties; do
            for k in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY AVATAR_PUBLIC_BASE_URL; do
              v=$(grep -E "^${k}=" "$f" | tail -n1 | cut -d= -f2-)
              if [ -z "$v" ]; then s="YOK"
              elif echo "$v" | grep -q "your_"; then s="YER TUTUCU (gecersiz)"
              else s="VAR"; fi
              echo "$f $k: $s"
            done
          done

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: List APKs
        run: find app/build/outputs/apk -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
